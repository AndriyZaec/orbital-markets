name: Deploy Gate Worker

on:
  push:
    branches: [master]
    paths:
      - 'apps/gate-worker/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-worker.yml'
    tags:
      - 'worker-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            apps/gate-worker/pnpm-lock.yaml

      - name: Install root deps (wrangler)
        run: pnpm install --frozen-lockfile

      - name: Materialize wrangler config with real resource ids
        working-directory: apps/gate-worker
        # The committed wrangler.toml has placeholders; production resource ids
        # are supplied through GitHub secrets.
        run: |
          cat > wrangler.local.toml <<EOF
          name = "orbital-gate"
          main = "src/index.ts"
          compatibility_date = "2024-12-01"
          workers_dev = false

          [[kv_namespaces]]
          binding = "BETA_INVITES"
          id = "${BETA_INVITES_KV_ID}"

          [[d1_databases]]
          binding = "WAITLIST_DB"
          database_name = "orbital-waitlist"
          database_id = "${WAITLIST_D1_ID}"
          migrations_dir = "migrations"

          [vars]
          LANDING_ORIGIN = "https://orbitalmarkets.xyz"
          EOF
        env:
          BETA_INVITES_KV_ID: ${{ secrets.BETA_INVITES_KV_ID }}
          WAITLIST_D1_ID: ${{ secrets.WAITLIST_D1_ID }}

      - name: Typecheck
        working-directory: apps/gate-worker
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test

      - name: Validate Worker bundle
        working-directory: apps/gate-worker
        run: ../../node_modules/.bin/wrangler deploy --dry-run --config wrangler.local.toml

      - name: Apply D1 migrations
        working-directory: apps/gate-worker
        run: pnpm d1:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        working-directory: apps/gate-worker
        run: ../../node_modules/.bin/wrangler deploy --config wrangler.local.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
