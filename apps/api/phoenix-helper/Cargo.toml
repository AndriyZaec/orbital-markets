[package]
name = "orbital-phoenix-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[[bin]]
name = "phoenix-helper"
path = "src/main.rs"

[dependencies]
phoenix-rise = { version = "=0.6.13", default-features = false, features = ["sdk"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
