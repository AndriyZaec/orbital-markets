[package]
name = "orbital-phoenix-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[[bin]]
name = "phoenix-helper"
path = "src/main.rs"

[dependencies]
base64 = "=0.23.1"
bincode = "=1.3.3"
bs58 = "=0.5.1"
phoenix-rise = { version = "=0.6.13", default-features = false, features = ["sdk"] }
phoenix-rise-events = "=0.6.13"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rust_decimal = "=1.43.0"
sha2 = "=0.10.9"
solana-hash = { version = "=4.7.0", features = ["decode"] }
solana-instruction = { version = "=3.5.1", default-features = false, features = ["std"] }
solana-message = { version = "=4.4.0", features = ["serde"] }
solana-pubkey = { version = "=4.4.0", features = ["curve25519"] }

[dev-dependencies]
borsh = "=1.8.1"

# Rise quantity operators include plain integer arithmetic. Financial views must
# fail closed on overflow in production, just as they do in debug builds.
[profile.release]
overflow-checks = true
