# Copy to fly.staging.local.toml (gitignored) and configure your staging resources.
app = 'your-app-staging'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'rolling'
  wait_timeout = '5m0s'

[env]
  ADDR = ':8080'
  DB_PATH = '/data/orbital.db'
  ENV = 'production'
  ALLOWED_ORIGIN = 'https://staging.example.com'
  BETA_COOKIE_NAME = '__beta_staging'
  # Optional Phoenix configuration: set your registered public builder authority.
  # PHOENIX_BUILDER_AUTHORITY = '<registered-public-builder-authority>'
  PHOENIX_MAX_TRANSACTION_FEE_LAMPORTS = '100000'
  PHOENIX_COMPUTE_UNIT_LIMIT = '400000'
  PHOENIX_COMPUTE_UNIT_PRICE_MICRO_LAMPORTS = '0'

[[mounts]]
  source = 'staging_data'
  destination = '/data'

[[services]]
  protocol = 'tcp'
  internal_port = 8080
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.http_checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '10s'
    method = 'get'
    path = '/api/v1/health'
    protocol = 'http'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
